version: "3.8"

services:
  baileys-api:
    build: .
    container_name: baileys-api
    ports:
      - "3025:3025"
    depends_on:
      - redis
    volumes:
      - ./storage:/usr/src/app/storage
      - ./logs:/usr/src/app/logs
      - ./media:/usr/src/app/media
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - PORT=3025
      - API_KEY=${API_KEY}
    command:
      - sh
      - "-c"
      - "bun manage-api-keys create admin $API_KEY && bun start"
    restart: always

  redis:
    image: redis:alpine
    container_name: baileys-api-redis
    restart: always
    volumes:
      - redis_data:/data

volumes:
  redis_data:
